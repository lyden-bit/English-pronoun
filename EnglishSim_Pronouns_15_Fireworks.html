<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EnglishSim - Pronoun Challenge</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#18265b,#7041a8);display:grid;place-items:center;font-family:Arial,sans-serif;padding:18px;color:#25315a}.game{width:min(100%,560px);background:white;border-radius:24px;padding:26px;text-align:center;box-shadow:0 15px 50px #1115}.logo{font-size:30px;font-weight:900;color:#5744c7}.tag{font-size:12px;letter-spacing:2px;color:#777;margin:8px}h2{font-size:22px}.track{height:12px;background:#e9e8f6;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#32b8db,#8753e7);transition:width .3s}.meta{display:flex;justify-content:space-between;margin:16px 0;color:#666;font-size:14px}.question{padding:26px 12px;background:#f1f3ff;border-radius:16px;font-size:23px;font-weight:bold;margin:20px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{cursor:pointer;border:0;border-radius:14px;padding:16px;font-size:19px;font-weight:bold}.choice{background:#f0edff;color:#4337a1;border:2px solid #e2ddff}.correct{background:#c8f7dc!important;border-color:#21b76a!important;color:#087b42!important}.wrong{background:#ffe0e0!important;border-color:#ee5555!important;color:#b22222!important}#feedback{min-height:45px;margin:15px 0;font-weight:bold}.next{display:none;width:100%;background:linear-gradient(90deg,#345bdb,#8b49db);color:white}.score{font-size:56px;color:#654bd1;font-weight:bold}#result{display:none}.footer{font-size:12px;color:#999;margin-top:22px}@keyframes fall{0%{transform:translateY(-15vh) rotate(0);opacity:1}100%{transform:translateY(115vh) rotate(750deg);opacity:0}}.confetti{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;overflow:hidden;width:100%;height:100%;display:none}.confetti i{position:absolute;top:-30px;width:10px;height:17px;animation:fall var(--duration) linear forwards;background:var(--color);left:var(--left);animation-delay:var(--delay)}@media(prefers-reduced-motion:reduce){.confetti i{animation:none;display:none}}</style></head><body><div class="confetti" id="confetti" aria-hidden="true"></div><main class="game"><div class="logo">ENGLISHSIM</div><div class="tag">LEARN ENGLISH FROM ZERO</div><section id="play"><h2>PRONOUN CHALLENGE</h2><p>Chọn đại từ nhân xưng phù hợp để điền vào chỗ trống.</p><div class="track"><div class="bar" id="bar"></div></div><div class="meta"><span id="number"></span><span id="points"></span></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div id="feedback" aria-live="polite"></div><button class="next" id="next" onclick="advance()">CÂU TIẾP THEO →</button></section><section id="result"><h2>🎉 CONGRATULATIONS!</h2><p>Bạn đã hoàn thành bài luyện tập!</p><div class="score" id="final"></div><p id="message"></p><button class="next" style="display:block" onclick="restart()">🔄 CHƠI LẠI</button></section><div class="footer">EnglishSim • Learn & Practice</div></main><script>
const questions=[["Lan is a girl. ___ is a girl.", "She", ["He", "She", "It", "They"]], ["Nam is a boy. ___ is a boy.", "He", ["She", "We", "He", "I"]], ["Lan and Nam are students. ___ are students.", "They", ["He", "She", "They", "It"]], ["My father is happy. ___ is happy.", "He", ["He", "She", "We", "You"]], ["My mother is happy. ___ is happy.", "She", ["They", "She", "He", "It"]], ["The cat is small. ___ is small.", "It", ["He", "We", "It", "I"]], ["Nam and I are friends. ___ are friends.", "We", ["They", "You", "We", "He"]], ["The book is new. ___ is new.", "It", ["She", "He", "They", "It"]], ["Mai and Hoa are sisters. ___ are sisters.", "They", ["We", "She", "They", "He"]], ["My brother is ten. ___ is ten.", "He", ["It", "He", "She", "They"]], ["My sister is a pupil. ___ is a pupil.", "She", ["She", "He", "We", "It"]], ["The dogs are friendly. ___ are friendly.", "They", ["It", "He", "They", "She"]], ["My friends and I are classmates. ___ are classmates.", "We", ["You", "We", "They", "She"]], ["This is my pencil. ___ is blue.", "It", ["He", "It", "She", "We"]], ["Tom, ___ are my best friend.", "you", ["he", "they", "you", "it"]]];
let index=0,score=0,locked=false;
function show(){locked=false;let q=questions[index];document.getElementById("number").textContent="Câu "+(index+1)+"/"+questions.length;document.getElementById("points").textContent="⭐ "+score+" điểm";document.getElementById("bar").style.width=(index/questions.length*100)+"%";document.getElementById("question").textContent=q[0];document.getElementById("feedback").textContent="";document.getElementById("next").style.display="none";let area=document.getElementById("answers");area.replaceChildren();q[2].forEach(answer=>{let b=document.createElement("button");b.className="choice";b.textContent=answer;b.onclick=()=>choose(answer,b);area.appendChild(b)})}
function choose(answer,button){if(locked)return;let correct=questions[index][1];if(answer===correct){locked=true;score++;button.classList.add("correct");document.getElementById("feedback").textContent="✅ Chính xác! Excellent!";document.getElementById("feedback").style.color="#159653";document.querySelectorAll(".choice").forEach(b=>b.disabled=true);let next=document.getElementById("next");next.style.display="block";next.textContent=index===questions.length-1?"XEM KẾT QUẢ 🎉":"CÂU TIẾP THEO →"}else{button.classList.add("wrong");button.disabled=true;document.getElementById("feedback").textContent="❌ Chưa đúng. Hãy thử lại nhé!";document.getElementById("feedback").style.color="#d44444"}}
function celebrate(){let layer=document.getElementById("confetti");layer.replaceChildren();layer.style.display="block";let colors=["#ffce31","#ff5b7f","#34d1bf","#8e65ff","#4aa3ff","#ff873a"];for(let i=0;i<110;i++){let piece=document.createElement("i");piece.style.setProperty("--left",Math.random()*100+"%");piece.style.setProperty("--delay",Math.random()*1.7+"s");piece.style.setProperty("--duration",(2.4+Math.random()*2.3)+"s");piece.style.setProperty("--color",colors[i%colors.length]);layer.appendChild(piece)}setTimeout(()=>{layer.style.display="none";layer.replaceChildren()},6500)}
function advance(){index++;if(index<questions.length){show();return}document.getElementById("play").style.display="none";document.getElementById("result").style.display="block";document.getElementById("final").textContent=score+"/"+questions.length;document.getElementById("message").textContent=score===questions.length?"🏆 XUẤT SẮC! Bạn đã trả lời đúng cả 15 câu!":"Good job! Hãy tiếp tục luyện tập nhé!";if(score===questions.length)celebrate()}
function restart(){index=0;score=0;document.getElementById("play").style.display="block";document.getElementById("result").style.display="none";show()}show();
</script></body></html>
