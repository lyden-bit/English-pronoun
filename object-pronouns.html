<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EnglishSim | OBJECT PRONOUNS</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eff6ff;background:#0a1530}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#254b92 0%,#0a1530 65%);display:flex;justify-content:center;align-items:center;padding:22px}.app{width:min(760px,100%);background:#10244bcc;border:1px solid #ffffff30;border-radius:28px;padding:clamp(20px,5vw,40px);box-shadow:0 24px 70px #0005}.brand{font-weight:900;letter-spacing:.18em;color:#81e6ff;font-size:14px}.tag{color:#b8ccef;margin-top:8px}h1{font-size:clamp(26px,5vw,42px);margin:12px 0 8px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:28px 0 12px;font-weight:700}.track{height:10px;background:#ffffff20;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#40d6f8,#9dfbaf);transition:width .3s}.question{font-size:clamp(21px,3.5vw,30px);line-height:1.5;font-weight:750;min-height:110px;margin:30px 0 20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:13px}.choice{border:1px solid #6586b7;background:#183761;color:white;padding:18px 14px;border-radius:16px;font-size:20px;cursor:pointer;min-height:70px}.choice:hover:not(:disabled){background:#26518b}.choice:disabled{cursor:default}.choice.correct{background:#146f55;border-color:#80ffbb}.choice.wrong{background:#923a4b;border-color:#ff9bac}.feedback{min-height:34px;margin-top:20px;font-weight:700}.next{background:#8aeaff;color:#09203e;border:0;border-radius:14px;padding:14px 26px;font-size:17px;font-weight:800;cursor:pointer}.next:disabled{opacity:.4;cursor:default}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.hidden{display:none}.result{text-align:center;padding:35px 0}.result h2{font-size:38px}.result p{font-size:21px}.confetti{position:fixed;top:-30px;width:9px;height:18px;pointer-events:none;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(900deg)}}@media(max-width:480px){.choices{grid-template-columns:1fr}.choice{min-height:55px}.question{min-height:80px}}
</style></head><body><main class="app"><div class="brand">ENGLISHSIM · PRONOUNS</div><div class="tag">Đại từ làm tân ngữ</div><h1>OBJECT PRONOUNS</h1><section id="game"><div class="top"><span id="count">Câu 1/15</span><span id="score">Điểm: 0</span></div><div class="track"><div id="fill" class="fill"></div></div><div id="question" class="question"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="bottom"><small>Chọn một đáp án đúng</small><button id="next" class="next" disabled>Câu tiếp theo →</button></div></section><section id="result" class="result hidden"><h2 id="endTitle"></h2><p id="endScore"></p><button class="next" onclick="restart()">Chơi lại ↻</button></section></main><script>
const questions=[{"q": "I saw Anna. I waved to ___.", "options": ["her", "us", "you", "me"], "answer": "her"}, {"q": "Tom is my friend. I like ___.", "options": ["us", "him", "her", "them"], "answer": "him"}, {"q": "These books are interesting. Read ___.", "options": ["you", "him", "them", "it"], "answer": "them"}, {"q": "Please call ___ tomorrow. (I)", "options": ["it", "them", "you", "me"], "answer": "me"}, {"q": "We are here. Come with ___.", "options": ["us", "it", "you", "them"], "answer": "us"}, {"q": "The dog is hungry. Feed ___.", "options": ["her", "them", "me", "it"], "answer": "it"}, {"q": "You are kind. I trust ___.", "options": ["her", "you", "us", "them"], "answer": "you"}, {"q": "My parents are home. I love ___.", "options": ["it", "you", "them", "us"], "answer": "them"}, {"q": "This gift is for ___. (she)", "options": ["you", "her", "him", "us"], "answer": "her"}, {"q": "Can you help ___? (we)", "options": ["us", "him", "her", "it"], "answer": "us"}, {"q": "Peter is late. Wait for ___.", "options": ["us", "you", "him", "me"], "answer": "him"}, {"q": "The phone is ringing. Answer ___.", "options": ["it", "you", "me", "him"], "answer": "it"}, {"q": "She knows ___. (I)", "options": ["us", "him", "me", "you"], "answer": "me"}, {"q": "I will invite ___ to the party. (they)", "options": ["you", "them", "it", "her"], "answer": "them"}, {"q": "Our teacher teaches ___ English. (we)", "options": ["you", "it", "us", "me"], "answer": "us"}];let index=0,score=0,answered=false;const el=id=>document.getElementById(id);function render(){answered=false;let q=questions[index];el('count').textContent=`Câu ${index+1}/${questions.length}`;el('score').textContent=`Điểm: ${score}`;el('fill').style.width=`${index/questions.length*100}%`;el('question').textContent=q.q;el('feedback').textContent='';el('next').disabled=true;el('next').textContent=index===questions.length-1?'Xem kết quả →':'Câu tiếp theo →';el('choices').innerHTML='';q.options.forEach((opt,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=`${'ABCD'[i]}. ${opt}`;b.onclick=()=>choose(opt);el('choices').append(b)})}function choose(opt){if(answered)return;answered=true;let q=questions[index],good=opt===q.answer;if(good)score++;[...el('choices').children].forEach(b=>{let val=b.textContent.slice(3);b.disabled=true;if(val===q.answer)b.classList.add('correct');else if(val===opt)b.classList.add('wrong')});el('feedback').textContent=good?'✓ Chính xác!':`✗ Chưa đúng. Đáp án: ${q.answer}`;el('score').textContent=`Điểm: ${score}`;el('next').disabled=false}el('next').onclick=()=>{if(++index<questions.length)render();else finish()};function finish(){el('game').classList.add('hidden');el('result').classList.remove('hidden');el('endTitle').textContent=score===15?'🎉 XUẤT SẮC! 🎉':'Hoàn thành!';el('endScore').textContent=`Anh/chị đạt ${score}/15 câu đúng.`;if(score===15)fireworks()}function fireworks(){for(let i=0;i<120;i++){let p=document.createElement('span');p.className='confetti';p.style.left=Math.random()*100+'vw';p.style.background=['#ffde59','#7bf2ff','#ff79b0','#a9ff95'][i%4];p.style.animationDelay=Math.random()*1.5+'s';p.style.animationDuration=2+Math.random()*2+'s';document.body.append(p);setTimeout(()=>p.remove(),5500)}}function restart(){index=score=0;el('result').classList.add('hidden');el('game').classList.remove('hidden');render()}render();
</script></body></html>
